<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>保健師相談記録</title>
    <style>
        @page {
            size: A4;
            margin: 15mm;
        }

        body {
            font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            font-size: 12px;
            color: #000;
        }

        .title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 6px;
            vertical-align: top;
        }

        th {
            text-align: center;
            font-weight: bold;
            background: #fff;
        }

        .label {
            width: 18%;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
        }

        .small-label {
            width: 14%;
            text-align: center;
            font-weight: bold;
        }

        .center {
            text-align: center;
        }

        .middle {
            vertical-align: middle;
        }

        .h-sm {
            height: 34px;
        }

        .h-md {
            height: 70px;
        }

        .h-lg {
            height: 150px;
        }

        .h-xl {
            height: 190px;
        }

        .support-table td {
            height: 40px;
        }
    </style>
</head>

<body>

    <div class="title">別記様式１</div>

    <table>
        <tr>
            <th class="label">相談日時</th>
            <td colspan="5">令和2年11月2日（月）　10:00 ～ 12:00</td>
        </tr>

        <tr>
            <th class="label" rowspan="2">相談者</th>
            <td rowspan="2" colspan="2" class="middle">相談者（本人・家族）</td>
            <th class="small-label">対象者</th>
            <td colspan="2" class="center">日本　太郎</td>
        </tr>

        <tr>
            <th class="small-label">相談方法</th>
            <td colspan="2" class="center">電話（着信）</td>
        </tr>

        <tr class="h-md">
            <th class="label">目的</th>
            <td colspan="5">保健師相談記録の目的</td>
        </tr>

        <tr class="h-md">
            <th class="label">主　訴</th>
            <td colspan="5">保健師相談記録の主訴</td>
        </tr>

        <tr class="h-lg">
            <th class="label">状況（客観的）</th>
            <td colspan="5">保健師相談記録の状況（客観的）</td>
        </tr>

        <tr class="h-xl">
            <th class="label">状況（主観的）</th>
            <td colspan="5">保健師相談記録の状況（主観的）</td>
        </tr>

        <tr class="h-md">
            <th class="label">分析・判断</th>
            <td colspan="5">保健師相談記録の状況（分析・判断）</td>
        </tr>

        <tr class="h-md">
            <th class="label">対応</th>
            <td colspan="5">保健師相談記録の対応・合意事項</td>
        </tr>

        <tr class="h-md">
            <th class="label">今後の計画</th>
            <td colspan="4">保健師相談記録の今後の計画</td>
            <td>
                <strong>【支援時期】</strong><br>
                令和3年1月2日<br>
                <strong>【終了】</strong><br>
                課題の解決
            </td>
        </tr>
    </table>

</body>

</html>
